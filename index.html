    <style>
        #resumePopup {
            background-color: rgba(255, 255, 255, 0.85);
        }
        .resume-field {
            margin: 10px 0;
            text-align: left;
        }
        .resume-label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 4px;
        }
        .resume-input-small {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        .resume-input-small:focus {
            border-color: #4a6fa5;
        }
        .resume-input {
            width: 100%;
            padding: 12px 15px;
            margin: 5px 0 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        .resume-input:focus {
            border-color: #4a6fa5;
        }
        .resume-error {
            color: #e74c3c;
            font-size: 12px;
            margin: 5px 0;
            display: none;
        }
        .resume-submit {
            width: 100%;
            padding: 12px;
            background-color: #fff;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .resume-submit:hover {
            background-color: #f5f5f5;
            border-color: #ccc;
        }
    </style>
</head>

<body>
    <span class="mobile btn-mobile-menu">

                        <a href="#" title="" class="blog-button">

                        </a>
                    </div>
                    <h1 class="panel-cover__title panel-title iUp">

                    </h1>
                    <p id="motto" class="panel-cover__subtitle panel-subtitle iUp">Pretty·Happy·Earnestly</p>
                    <hr class="panel-cover__divider iUp" />
                    <p id="description" class="panel-cover__description iUp">欢迎来到人间游乐场！
                        <br/>

                    </p>
                    <div class="navigation-wrapper iUp">
                        <div>

                                        <a href="javascript:void(0);" title="email" class="email-toggle-btn">
                                            <i class='social iconfont icon-email'></i>
                                            <span class="label">email</span>
                                        </a>
                                        <div class="email-expand-panel">
                                            <span class="email-text">1450499496@qq.com</span>
                                        </div>
                                    </li>
                                </ul>

                        </div>
                    </div>
                </div>
            </div>
            <div class="panel-cover--overlay cover-slate"></div>
        </div>
        <div class="remark iUp">

                <a href="https://github.com/features/actions" target="_blank" rel="noopener noreferrer"> GitHub Actions </a> And

    <div class="blog-popup-overlay" id="blogPopupOverlay" onclick="closeBlogPopup()"></div>
    <div class="blog-popup" id="blogPopup">
        <button class="blog-popup-close" onclick="closeBlogPopup()">×</button>
        <img src="./assets/img/wechat.jpg" alt="微信二维码" class="blog-popup-img">
    </div>

    <div class="blog-popup-overlay" id="resumePopupOverlay" onclick="closeResumePopup()"></div>
    <div class="blog-popup" id="resumePopup">
        <button class="blog-popup-close" onclick="closeResumePopup()">×</button>
        <p class="blog-popup-desc">请验证以下任一信息，下载我的简历~</p>
        
        <div class="resume-field">
            <label class="resume-label">手机号后四位：</label>
            <input type="text" id="resumePhone" class="resume-input-small" placeholder="请输入" maxlength="4">
        </div>
        
        <div class="resume-field">
            <label class="resume-label">招聘平台网名：</label>
            <input type="text" id="resumeNickname" class="resume-input-small" placeholder="请输入">
        </div>
        
        <div class="resume-field">
            <label class="resume-label">我曾供职哪家公司：</label>
            <input type="text" id="resumeCompany" class="resume-input-small" placeholder="请输入">
        </div>
        
        <p class="resume-error" id="resumeError">输入错误，请重新输入</p>
        <button class="resume-submit" onclick="verifyResume()">确认</button>
    </div>

    <script type="text/javascript" src="./assets/js/main.js"></script>
    <script type="text/javascript" src="./assets/json/images.json?cb=getBingImages"></script>
    <script type="text/javascript" src="./assets/json/motto.json?cb=getMotto"></script>
    <script type="text/javascript" src="./assets/json/signatures.json?cb=getCustomSignatures"></script>
    
    <script>
        function toggleResumePopup() {
            const popup = document.getElementById('resumePopup');
            const overlay = document.getElementById('resumePopupOverlay');
            if (popup && overlay) {
                popup.classList.toggle('show');
                overlay.classList.toggle('show');
                document.getElementById('resumePhone').value = '';
                document.getElementById('resumeNickname').value = '';
                document.getElementById('resumeCompany').value = '';
                document.getElementById('resumeError').style.display = 'none';
            }
        }

        function closeResumePopup() {
            const popup = document.getElementById('resumePopup');
            const overlay = document.getElementById('resumePopupOverlay');
            if (popup && overlay) {
                popup.classList.remove('show');
                overlay.classList.remove('show');
                document.getElementById('resumePhone').value = '';
                document.getElementById('resumeNickname').value = '';
                document.getElementById('resumeCompany').value = '';
                document.getElementById('resumeError').style.display = 'none';
            }
        }

        function verifyResume() {
            const phone = document.getElementById('resumePhone').value.trim();
            const nickname = document.getElementById('resumeNickname').value.trim();
            const company = document.getElementById('resumeCompany').value.trim();
            const errorElement = document.getElementById('resumeError');
            
            const validCompanies = ['快手', '腾讯', '喜马拉雅', '工商银行'];
            
            if (phone === '1635' || nickname.toLowerCase() === 'melody' || validCompanies.includes(company)) {
                closeResumePopup();
                window.open('./assets/img/resume.pdf', '_blank');
            } else {
                errorElement.style.display = 'block';
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeResumePopup();
            }
        });

        ['resumePhone', 'resumeNickname', 'resumeCompany'].forEach(function(id) {
            document.getElementById(id).addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    verifyResume();
                }
            });
        });
    </script>
</body>
